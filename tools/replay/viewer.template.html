<!DOCTYPE html>
<meta charset="utf-8">
<title>Bonsai replay</title>
<!--
  Bonsai episode replay viewer.

  Renders a .rec.jsonl.gz produced by lab_agent/bonsai_lab_agent/recorder.py.
  Single self-contained file: no build step, no network, no dependencies. Open it
  and drop a recording on it.

  Tiles are drawn the way Dwarf Fortress itself does it - glyph from the tile's
  SHAPE, colour from its MATERIAL - rather than from a shipped tileset image. That
  keeps the file dependency-free and, more importantly, means an unknown tiletype
  degrades to a sensible glyph instead of a missing sprite. Headless DF does not
  render the map into its screen buffer (probe-confirmed), so there is no
  DF-generated image to compare against; drawing from semantics is the only
  option, and the tile name is always one hover away for spot-checking.
-->
<style>
  :root {
    --bg: #12110f; --panel: #1a1815; --line: #2e2a25;
    --ink: #d8d0c4; --dim: #8b8377; --accent: #c9a227; --bad: #b4574a; --good: #6d9b5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: .06em; }
  header .meta { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  #stage { position: relative; overflow: auto; padding: 12px; }
  canvas { image-rendering: pixelated; display: block; }
  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 12px; min-height: 0;
  }
  .ctl { display: flex; gap: 8px; align-items: center; }
  button, select {
    background: #232019; color: var(--ink); border: 1px solid var(--line);
    padding: 4px 10px; font: inherit; cursor: pointer; border-radius: 3px;
  }
  button:hover:not(:disabled), select:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  input[type=range] { width: 260px; accent-color: var(--accent); }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--dim); margin: 18px 0 8px; font-weight: 600;
  }
  h2:first-child { margin-top: 0; }
  .stat { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .stat b { font-weight: 600; }
  .spark { display: block; margin: 2px 0 8px; }
  .round { border-left: 2px solid var(--line); padding: 4px 0 4px 8px; margin-bottom: 8px; }
  .round.active { border-left-color: var(--accent); background: #201d17; }
  .round .hd { color: var(--dim); font-size: 11px; }
  .ok { color: var(--good); }
  .no { color: var(--bad); }
  .drop {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: var(--bg); text-align: center; color: var(--dim); padding: 40px;
  }
  .drop.hide { display: none; }
  .drop strong { color: var(--ink); display: block; margin-bottom: 8px; font-size: 15px; }
  #tip {
    position: fixed; pointer-events: none; background: #000; border: 1px solid var(--line);
    padding: 4px 7px; font-size: 12px; border-radius: 3px; display: none; z-index: 9;
    max-width: 280px;
  }
  .legend { color: var(--dim); font-size: 11px; line-height: 1.7; }
  .legend i { font-style: normal; display: inline-block; width: 1.2em; text-align: center; }
</style>

<header>
  <h1>BONSAI REPLAY</h1>
  <div class="ctl">
    <button id="play" disabled>▶</button>
    <input type="range" id="scrub" min="0" max="0" value="0" disabled>
    <span id="pos" class="meta">—</span>
  </div>
  <div class="ctl">
    <label class="meta" for="zsel">z</label>
    <select id="zsel" disabled></select>
    <label class="meta" for="zoom">px</label>
    <select id="zoom">
      <option>6</option><option selected>9</option><option>12</option><option>16</option>
    </select>
  </div>
  <div class="meta" id="hdr"></div>
</header>

<main>
  <div id="stage">
    <canvas id="map"></canvas>
    <div class="drop" id="drop">
      <div>
        <strong>Drop a recording here</strong>
        <code>*.rec.jsonl.gz</code> from <code>/srv/df-bonsai/recordings</code><br><br>
        <input type="file" id="file" accept=".gz,.jsonl">
      </div>
    </div>
  </div>
  <aside>
    <h2>Fort</h2>
    <div id="stats"></div>
    <h2>Curves</h2>
    <div id="charts"></div>
    <h2>Agent decisions</h2>
    <div id="feed"></div>
    <h2>Legend</h2>
    <div class="legend" id="legend"></div>
  </aside>
</main>
<div id="tip"></div>

<script id="enums" type="application/json">__ENUMS__</script>
<script id="sprites" type="application/json">__SPRITES__</script>
<script id="tilemap" type="application/json">__TILEMAP__</script>
<script id="palette" type="application/json">__PALETTE__</script>
<script id="geology" type="application/json">__GEOLOGY__</script>
<script>
"use strict";
const ENUMS = JSON.parse(document.getElementById("enums").textContent);

// ---------------------------------------------------------------- tile appearance
// Sprites come from the game's OWN graphics raws (see tools/replay/extract_sprites.py):
// [TILE_GRAPHICS:PAGE:col:row:TOKEN] packed into one atlas, and tilemap.json says which
// token family each tiletype uses. Nothing about the look is invented here.
//
// The glyph fallback below is only for tiletypes with no sprite (94% are mapped) and
// for recordings viewed without an atlas. Glyph from SHAPE, colour from MATERIAL — DF's
// own decomposition — so an unmapped tile shows as visible terrain, not a hole.
const SPRITES = JSON.parse(document.getElementById("sprites").textContent || "null");
const TILEMAP = JSON.parse(document.getElementById("tilemap").textContent || "null");
const ENTITY_TOKENS = new Set(SPRITES ? Object.keys(SPRITES.tokens) : []);
const MAT_SUFFIX = {1:"WOOD", 2:"STONE", 3:"METAL", 4:"GLASS"};
const FURNITURE = {
  Chair:"ITEM_CHAIR", Bed:"ITEM_BED", Table:"ITEM_TABLE", Coffin:"ITEM_COFFIN",
  Door:"ITEM_DOOR", Box:"ITEM_BOX", Weaponrack:"ITEM_WEAPON_RACK",
  Armorstand:"ITEM_ARMOR_STAND", Cabinet:"ITEM_CABINET", Statue:"ITEM_STATUE",
  Hatch:"ITEM_HATCH", Slab:"ITEM_SLAB", Bookcase:"ITEM_BOOKCASE",
  TractionBench:"ITEM_TRACTION_BENCH",
};
const WORKSHOP = {
  Carpenters:"CARPENTER", Farmers:"FARMER", Masons:"MASON", Craftsdwarfs:"CRAFTS",
  Jewelers:"JEWELER", MetalsmithsForge:"METALSMITH", MagmaForge:"MAGMAFORGE",
  Bowyers:"BOWYER", Mechanics:"MECHANIC", Siege:"SIEGE", Butchers:"BUTCHER",
  Leatherworks:"LEATHER", Tanners:"TANNER", Clothiers:"CLOTHES", Fishery:"FISHERY",
  Still:"STILL", Loom:"LOOM", Quern:"QUERN", Kennels:"KENNEL", Kitchen:"KITCHEN",
  Ashery:"ASHERY", Dyers:"DYER", Millstone:"MILLSTONE",
};
const FURNACE = {
  WoodFurnace:"WOOD", Smelter:"SMELTER", MagmaSmelter:"SMELTER_LAVA",
  GlassFurnace:"GLASS", MagmaGlassFurnace:"GLASS_LAVA", Kiln:"KILN",
  MagmaKiln:"KILN_LAVA",
};
const epick = (...c) => c.find((x) => x && ENTITY_TOKENS.has(x)) || null;
function familyFallback(prefix) {
  const bad = /DAMAGE|DAMAGED|BLOOD|VOMIT|MUD|WATER|DEBRIS|FORBIDDEN|SPIKES|RINGS|STUDS|ENGRAVING|OVERLAY/;
  const a = [...ENTITY_TOKENS].filter((t) => (t === prefix || t.startsWith(prefix + "_")) && !bad.test(t));
  a.sort((x,y) => (x.split("_").length-y.split("_").length) || (x.length-y.length) || x.localeCompare(y));
  return a[0] || null;
}
function itemToken(it) {
  let name = ENUMS.item && ENUMS.item[it[1]];
  if (!name || name === "NONE") return null;
  let p = "ITEM_" + name.toUpperCase().replace(/[^A-Z0-9]+/g,"_").replace(/^_|_$/g,"");
  p = ({ITEM_ARMORSTAND:"ITEM_ARMOR_STAND", ITEM_WEAPONRACK:"ITEM_WEAPON_RACK",
        ITEM_HATCH_COVER:"ITEM_HATCH"})[p] || p;
  const raw=it.length>12&&it[12];
  if (raw && ["FISH","FISH_RAW","CORPSE","CORPSEPIECE","REMAINS"].includes(name)) {
    const creature="CREATURE_"+String(raw).toUpperCase().replace(/[^A-Z0-9_]+/g,"_");
    if (ENTITY_TOKENS.has(creature)) return creature;
  }
  if (["CORPSEPIECE","REMAINS"].includes(name) && ENTITY_TOKENS.has("ITEM_REMAINS"))
    return "ITEM_REMAINS";
  const mat = MAT_SUFFIX[it.length > 10 ? it[10] : 0];
  return epick(mat && `${p}_${mat}`, p) || familyFallback(mat ? `${p}_${mat}` : p) || familyFallback(p);
}
function creatureToken(u) {
  const raw = u.length > 9 && u[9];
  const t = raw && ("CREATURE_" + String(raw).toUpperCase().replace(/[^A-Z0-9_]+/g,"_"));
  if (t && ENTITY_TOKENS.has(t)) return t;
  return u.length > 7 && u[7] && ENTITY_TOKENS.has("CREATURE_DWARF") ? "CREATURE_DWARF" : null;
}
function buildStage(b) {
  const now = b.length > 9 ? b[9] : 3, max = b.length > 10 ? b[10] : 3;
  if (now < 0) return 3;
  return Math.max(0, Math.min(3, max > 0 ? Math.round(3 * now / max) : now));
}
function buildingCells(b) {
  if (b.length < 7) return [];
  const type = ENUMS.bld && ENUMS.bld[b[1]], mat = MAT_SUFFIX[b.length > 13 ? b[13] : 0];
  const fam = FURNITURE[type];
  if (fam) {
    const empty = (type === "Weaponrack" || type === "Armorstand") && mat && `${fam}_${mat}_EMPTY`;
    const tok = epick(empty, mat && `${fam}_${mat}`, fam) || familyFallback(fam);
    return tok ? [[b[2], b[3], tok]] : [];
  }
  if (type === "Wagon" && ENTITY_TOKENS.has("WAGON_BLD"))
    return [[Math.floor((b[2]+b[4])/2),Math.floor((b[3]+b[5])/2),"WAGON_BLD"]];
  const sub = b.length > 7 ? b[7] : -1;
  let base = null;
  if (type === "Workshop") base = WORKSHOP[ENUMS.workshop && ENUMS.workshop[sub]];
  if (type === "Furnace") base = FURNACE[ENUMS.furnace && ENUMS.furnace[sub]];
  if (!base) return [];
  const prefix = (type === "Workshop" ? "WORKSHOP_" : "FURNACE_") + base;
  const stage = buildStage(b), baseCells = [], overlayCells = [];
  const width=b[4]-b[2]+1, height=b[5]-b[3]+1;
  // Live 53.16 maps a footprint cell to raw [stage][x][y+1]. Row zero is not drawn.
  // The game's one registered building texture is reconstructed from base + detail.
  for (let dy=0; dy<height; dy++) for (let dx=0; dx<width; dx++) {
    const x=b[2]+dx, y=b[3]+dy, rawY=dy+1;
    for (const [layer,target] of [["",baseCells],["_OVERLAY",overlayCells]]) {
      const p=prefix+layer;
      const tok=epick(`${p}_S${stage}_${dx}_${rawY}`, `${p}_S3_${dx}_${rawY}`, `${p}_S0_${dx}_${rawY}`);
      if (tok) target.push([x,y,tok]);
    }
  }
  return baseCells.concat(overlayCells);
}
function liquidToken(v) {
  const depth=v&7; if (!depth) return null;
  if (v&8) return epick(`MAGMA_${depth<=2?1:depth<=5?2:3}`, "MAGMA_3", "MAGMA_1");
  return epick("WATER");
}

// ---------------------------------------------------------------- palette recolouring
// DF v50 does not ship one sprite per stone. Natural rock, soil and wood are drawn ONCE
// in a fixed set of key colours and the game swaps those colours at draw time for the
// row belonging to the tile's material — palettes.png is 18 colours x 137 rows, row 0
// being "the one used in the images themselves" (palette_default.txt:9). Drawing the key
// art unswapped is why soil walls came out grey while the soil FLOOR beside them was
// brown: the art is grey; the game is what makes it brown.
//
// A material's row is its descriptor colour + 1. descriptors.colors has exactly 136
// entries whose ids are the PALETTE_COLOR names in the same order (colors[0] is AMBER,
// declared as [PALETTE_COLOR:AMBER:1]), verified against BROWN=13, GRAY=50, TAN=101.
// GEOLOGY carries that row per tile for the save, dumped once — geology is fixed at
// worldgen, so it also describes recordings made before the map track knew about it.
const PALETTE = JSON.parse(document.getElementById("palette").textContent || "null");
const GEOLOGY = JSON.parse(document.getElementById("geology").textContent || "null");
const PAL_TOKENS = PALETTE ? new Set(PALETTE.tokens) : null;
const WOOD_ROW = 13;                                  // PALETTE_COLOR:BROWN:13
const WOODY = new Set(["TREE", "MUSHROOM", "PLANT"]); // tiletype material classes
let GEO_GRID = null;
if (GEOLOGY) {
  const [gw, gh, gd] = GEOLOGY.dims;
  GEO_GRID = new Uint8Array(gw * gh * gd);
  let at = 0;
  for (let i = 0; i < GEOLOGY.prle.length; i += 2) {
    GEO_GRID.fill(GEOLOGY.prle[i], at, at + GEOLOGY.prle[i + 1]);
    at += GEOLOGY.prle[i + 1];
  }
}

// Nearest key colour within a small tolerance. PNG re-encoding and anti-aliasing move a
// pixel by a unit or two, and matching exactly left those pixels grey inside otherwise
// recoloured art.
const KEY_CACHE = new Map();
function keyIndex(r, g, b) {
  const k = (r << 16) | (g << 8) | b;
  const hit = KEY_CACHE.get(k);
  if (hit !== undefined) return hit;
  let best = -1, bd = 7;
  for (let i = 0; i < PALETTE.key.length; i++) {
    const c = PALETTE.key[i];
    const d = Math.max(Math.abs(r - c[0]), Math.abs(g - c[1]), Math.abs(b - c[2]));
    if (d < bd) { best = i; bd = d; }
  }
  const out = bd <= 6 ? best : -1;
  KEY_CACHE.set(k, out);
  return out;
}

// One offscreen canvas per (token, row). A fort is thousands of tiles drawn from a
// handful of materials, so the cache is small and the per-pixel work happens once.
const SWAP_CACHE = new Map();
function swapped(tok, row) {
  const ck = tok + "#" + row;
  const hit = SWAP_CACHE.get(ck);
  if (hit) return hit;
  const T = SPRITES.tile, [ax, ay] = SPRITES.tokens[tok];
  const c = document.createElement("canvas");
  c.width = T; c.height = T;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(ATLAS, ax * T, ay * T, T, T, 0, 0, T, T);
  const img = g.getImageData(0, 0, T, T), d = img.data, table = PALETTE.table[row];
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] <= 8) continue;
    const j = keyIndex(d[i], d[i + 1], d[i + 2]);
    if (j >= 0) { d[i] = table[j][0]; d[i + 1] = table[j][1]; d[i + 2] = table[j][2]; }
  }
  g.putImageData(img, 0, 0);
  SWAP_CACHE.set(ck, c);
  return c;
}
const ATLAS = new Image();
let atlasReady = false;
if (SPRITES && SPRITES.atlas) {
  ATLAS.onload = () => { atlasReady = true; if (FRAMES.length) drawMap(); };
  ATLAS.src = SPRITES.atlas;
}

const GLYPH = {
  EMPTY: " ", NONE: " ", ENDLESS_PIT: " ",
  FLOOR: ".", RAMP_TOP: ".", BROOK_TOP: "≈", BROOK_BED: "=",
  WALL: "█", FORTIFICATION: "▤", RAMP: "▲",
  STAIR_UP: "<", STAIR_DOWN: ">", STAIR_UPDOWN: "X",
  BOULDER: "*", PEBBLES: "\"", SHRUB: "♠", SAPLING: "†",
  TRUNK_BRANCH: "♣", BRANCH: "♣", TWIG: "'",
};
const COLOR = {
  AIR: "#0d0c0b", NONE: "#0d0c0b",
  STONE: "#8d8880", SOIL: "#7a5c3e", MINERAL: "#c9a227", LAVA_STONE: "#4a4340",
  CONSTRUCTION: "#b9b2a6", ASHES: "#5a5550", DRIFTWOOD: "#6b5540",
  GRASS_LIGHT: "#5c9a4a", GRASS_DARK: "#3d7038", GRASS_DRY: "#9a8a45", GRASS_DEAD: "#7d6b4a",
  PLANT: "#4f8a45", TREE: "#6b8f4a", ROOT: "#6b5540", MUSHROOM: "#9a7fa8",
  RIVER: "#3f6fa8", POOL: "#3f6fa8", BROOK: "#4a7fb8", FROZEN_LIQUID: "#a8c8e0",
  MAGMA: "#d4562a", FIRE: "#e08030", CAMPFIRE: "#e08030",
  HFS: "#8a4fa8", UNDERWORLD_GATE: "#8a4fa8", FEATURE: "#4aa8a0",
};
const tileInfo = (tt) => ENUMS.tt[tt] || ["NONE", "NONE", "tiletype " + tt];

// Deterministic per-cell variant pick. DF varies floors and walls for texture; using a
// position hash (rather than a random) keeps a tile looking the same in every frame,
// otherwise the whole fort would shimmer as you scrub the timeline.
function vhash(x, y, z) {
  let h = (x * 73856093) ^ (y * 19349663) ^ (z * 83492791);
  h = (h ^ (h >>> 13)) >>> 0;
  return h;
}

const DIRS = [["N", 0, -1], ["S", 0, 1], ["W", -1, 0], ["E", 1, 0]];
function canonicalRampSuffix(parts) {
  const p = new Set(parts), card = ["N","S","W","E"].filter((d) => p.has(d));
  if (card.length === 4) card.splice(0, 4, "N", "S", "E", "W");
  return [...card, ...["NW","NE","SW","SE"].filter((d) => p.has(d))].join("_");
}
function decodeFloorFlag(flag) {
  // JS bitwise operators truncate to 32 bits; division preserves DF's 35-bit value.
  let v = Number(flag || 0), out = {};
  for (const d of ["S","W","E","N"]) { out[d] = v % 256; v = Math.floor(v / 256); }
  out.special = v % 8;
  return out;
}
function rampSuffixFromFlag(flag) {
  let v = Math.floor(Number(flag || 0) / 256), out = [];
  for (const d of ["N","W","E","S","NW","NE","SW","SE"]) {
    if (v % 2) out.push(d);
    v = Math.floor(v / 2);
  }
  return canonicalRampSuffix(out);
}
const WALL_INTERIOR = "__WALL_INTERIOR__";

function variantOf(tt) {
  const v = ENUMS.tt[tt];
  return v && v.length > 3 && v[3] >= 0 ? v[3] : null;
}

function tileWallSuffix(tt) {
  const description = String(tileInfo(tt)[2] || "");
  const match = description.match(/\b([LRUD]+)$/);
  if (!match) return null;
  const letters = new Set(match[1]);
  return [["N","U"],["S","D"],["W","L"],["E","R"]]
    .filter(([, letter]) => !letters.has(letter)).map(([direction]) => direction).join("_");
}

function spriteToken(tt, x, y, z, f, W, H, zi) {
  const m = TILEMAP && TILEMAP.tiles[tt];
  if (!m) return null;
  const fam = m.f, kind = m.k, toks = SPRITES.tokens;
  const pick = (...cands) => cands.find((c) => c && toks[c]) || null;
  const gx = x, gy = y;                       // already map coordinates
  const lx = x - f.origin[0], ly = y - f.origin[1];
  const varIdx = variantOf(tt);

  if (kind === "plain") return pick(fam);

  if (kind === "var4") {
    // DF's own variant index, not a hash. Eight grass tiletypes are four sprites x two
    // shades; hashing them collapsed the game's pattern into uniform noise.
    const i = varIdx !== null ? varIdx : (vhash(gx, gy, z) & 3);
    return pick(`${fam}_${i + 1}`, fam + "_1");
  }

  if (kind === "floor9") {
    // _1.._9 is a 3x3 EDGE-BLEND patch on the sheet, not nine variants: _5 is the solid
    // centre and the eight around it are mostly-empty feathers meant to be composited ON
    // TOP of it where a different material abuts. Returning a feather INSTEAD of the
    // centre drew a one-tile-wide mined corridor as DIRT_FLOOR_4 - 47 opaque pixels out
    // of 1024 - so a year of digging showed up as black lines through the rock. The
    // centre is the tile; edgeTokens() adds the feathers.
    const alts = ["_5", "_5B", "_5C", "_5D"];
    const i = varIdx !== null ? varIdx : (vhash(gx, gy, z) & 3);
    return pick(fam + alts[i & 3], fam + "_5", fam + "_1");
  }

  if (kind === "stair") {
    const shape = tileInfo(tt)[0];
    const suf = shape === "STAIR_UP" ? "_UP" : shape === "STAIR_DOWN" ? "_DOWN" : "_UPDOWN";
    return pick(fam + suf, fam + "_UPDOWN");
  }

  const solid = (nx, ny) => {
    if (nx < 0 || ny < 0 || nx >= W || ny >= H) return true;
    const nm = TILEMAP.tiles[f.grid[zi * W * H + ny * W + nx]];
    return !!nm && (nm.k === "wall" || nm.k === "tree");
  };
  const on = DIRS.filter(([, dx, dy]) => solid(lx + dx, ly + dy)).map(([d]) => d);

  if (kind === "wall") {
    const encoded = tileWallSuffix(tt);
    // Premium wall tokens name exposed borders. Natural walls have no LRUD form in
    // the tiletype, so complement their solid-neighbour fallback just like the
    // direction-bearing smooth and constructed walls above.
    const exposed = DIRS.filter(([, dx, dy]) => !solid(lx + dx, ly + dy)).map(([d]) => d);
    const key = encoded === null ? exposed.join("_") : encoded;
    if (key === "") return WALL_INTERIOR;
    const v = (vhash(gx, gy, z) % 4) + 1;
    return pick(`${fam}_${key}_${v}`, `${fam}_${key}`, fam + "_N_S_W_E_1", fam + "_N_S_W_E");
  }
  if (kind === "tree") {
    return pick(`${fam}_${on.join("")}`, fam, fam + "_NSWE");
  }
  if (kind === "ramp") {
    const card = Object.fromEntries(DIRS.map(([d,dx,dy]) => [d,solid(lx+dx,ly+dy)]));
    const c = DIRS.filter(([d]) => card[d]).map(([d]) => d);
    for (const [d,dx,dy,a,b] of [["NW",-1,-1,"N","W"],["NE",1,-1,"N","E"],
                                 ["SW",-1,1,"S","W"],["SE",1,1,"S","E"]])
      if (!card[a] && !card[b] && solid(lx+dx,ly+dy)) c.push(d);
    const base=fam.endsWith("_WITH_WALL")?fam.slice(0,-10):fam;
    return pick(c.length?`${base}_WITH_WALL_${c.join("_")}`:null, base+"_OTHER");
  }
  return null;
}

// Tinting: DF ships many terrain sprites desaturated and colours them by the tile's
// material (the raws call these PALETTE sprites). Tinted results are cached per
// token+colour — without the cache this is a per-tile offscreen composite every frame.
const tintCache = new Map();
function tintedSprite(token, color) {
  const key = token + "|" + color;
  let c = tintCache.get(key);
  if (c) return c;
  const T = SPRITES.tile, [sx, sy] = SPRITES.tokens[token];
  c = document.createElement("canvas");
  c.width = c.height = T;
  const g = c.getContext("2d");
  g.drawImage(ATLAS, sx * T, sy * T, T, T, 0, 0, T, T);
  g.globalCompositeOperation = "multiply";
  g.fillStyle = color;
  g.fillRect(0, 0, T, T);
  g.globalCompositeOperation = "destination-in";     // keep the sprite's own alpha
  g.drawImage(ATLAS, sx * T, sy * T, T, T, 0, 0, T, T);
  tintCache.set(key, c);
  return c;
}

// ---------------------------------------------------------------- state
let EV = [], FRAMES = [], META = null, ROUNDS = [], STATS = [];
let cur = 0, curZ = 0, playing = null;

const $ = (id) => document.getElementById(id);
const cv = $("map"), ctx = cv.getContext("2d");

// ---------------------------------------------------------------- loading
async function loadFile(f) {
  let buf = await f.arrayBuffer();
  let text;
  if (f.name.endsWith(".gz")) {
    const ds = new DecompressionStream("gzip");
    text = await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
  } else {
    text = new TextDecoder().decode(buf);
  }
  EV = text.split("\n").filter(Boolean).map((l) => {
    try { return JSON.parse(l); } catch { return null; }   // tolerate a truncated tail
  }).filter(Boolean);
  build();
}

function build() {
  META = EV.find((e) => e.kind === "meta") || {};
  ROUNDS = EV.filter((e) => e.kind === "round");
  STATS = EV.filter((e) => e.kind === "stat");
  // Also accept a raw bonsai-map-capture JSONL. That turns the same viewer into a live
  // renderer/debugger without manufacturing a fake episode wrapper first.
  const maps = EV.filter((e) => e.kind === "map" || e.kind === "kf" || e.kind === "d");

  // Reconstruct each frame: a keyframe rebuilds the grid, a delta patches it.
  FRAMES = [];
  let grid = null, paletteGrid = null, origin = null, dims = null;
  for (const m of maps) {
    if ((m.keyframe || m.kind === "kf") && m.rle) {
      origin = m.origin; dims = m.dims;
      grid = new Uint16Array(dims[0] * dims[1] * dims[2]);
      let p = 0;
      for (let k = 0; k < m.rle.length; k += 2) {
        const v = m.rle[k], n = m.rle[k + 1];
        grid.fill(v, p, p + n); p += n;
      }
    } else if (grid && m.set) {
      for (let k = 0; k < m.set.length; k += 2) grid[m.set[k]] = m.set[k + 1];
    }
    if (!grid) continue;
    // Fog of war. Undiscovered tiles are what the player has NOT dug to or seen, and
    // they are the difference between a replay and a map dump: at embark this save is
    // 100% hidden below z=47, so a viewer without the mask shows an entire rock layer
    // the player never saw. Recordings made before the capture carried `hrle` have no
    // mask and are drawn fully revealed — it cannot be reconstructed after the fact
    // (guessing from tiletypes agreed with the engine on only 31-96% of tiles).
    let fog = null;
    if (m.hrle) {
      fog = new Uint8Array(grid.length);
      let q = 0;
      for (let k = 0; k < m.hrle.length; k += 2) {
        fog.fill(m.hrle[k], q, q + m.hrle[k + 1]); q += m.hrle[k + 1];
      }
    }
    let liquid = null;
    if (m.lrle) {
      liquid = new Uint8Array(grid.length);
      let q = 0;
      for (let k = 0; k < m.lrle.length; k += 2) {
        liquid.fill(m.lrle[k], q, q + m.lrle[k + 1]); q += m.lrle[k + 1];
      }
    }
    if (m.prle) {
      paletteGrid = new Uint8Array(grid.length);
      let q = 0;
      for (let k = 0; k < m.prle.length; k += 2) {
        paletteGrid.fill(m.prle[k], q, q + m.prle[k + 1]); q += m.prle[k + 1];
      }
    } else if (paletteGrid && m.pset) {
      for (let k = 0; k < m.pset.length; k += 2) paletteGrid[m.pset[k]] = m.pset[k + 1];
    }
    let viewport = m.viewport ? {...m.viewport} : null;
    if (viewport) {
      viewport.texrefs=Object.fromEntries((viewport.tex||[]).map(
        (row)=>[row[0],`${row[1]}:${row[2]}:${row[3]}`]));
      for (const [src,dst] of [["bgrle","bg"],["bg2rle","bg2"],["frle","floor"],
                               ["rrle","ramp"],["srle","shadow"],["trle","top"]]) {
        if (!viewport[src]) continue;
        const values = [];
        for (let k=0;k<viewport[src].length;k+=2)
          for (let n=0;n<viewport[src][k+1];n++) values.push(viewport[src][k]);
        viewport[dst] = values;
      }
    }
    FRAMES.push({ tick: m.tick, i: m.i, origin, dims, dfv: m.dfv,
                  grid: grid.slice(), fog, liquid,
                  palette: paletteGrid && paletteGrid.slice(), units: m.units || [],
                  blds: m.blds || [], items: m.items || [], viewport });
  }

  $("drop").classList.add("hide");
  $("hdr").textContent = [
    META.episode_id, META.regime_key && "regime " + META.regime_key,
    ENUMS.df, FRAMES.length + " frames", ROUNDS.length + " rounds",
  ].filter(Boolean).join("  ·  ");
  const recVersion = FRAMES.find((f) => f.dfv)?.dfv;
  if (recVersion && !String(ENUMS.df || "").includes(recVersion)) {
    $("hdr").textContent += `  ·  VERSION MISMATCH recording ${recVersion} / assets ${ENUMS.df}`;
    $("hdr").classList.add("no");
  } else {
    $("hdr").classList.remove("no");
  }

  if (!FRAMES.length) {
    $("stage").insertAdjacentHTML("beforeend",
      "<p class='meta' style='padding:20px'>No map track in this recording — " +
      "it was recorded with decisions and metrics only. Curves and the decision " +
      "feed still work.</p>");
  } else {
    const [, , D] = FRAMES[0].dims;
    const z0 = FRAMES[0].origin[2];
    $("zsel").innerHTML = "";
    for (let i = D - 1; i >= 0; i--) {
      $("zsel").insertAdjacentHTML("beforeend", `<option value="${z0 + i}">${z0 + i}</option>`);
    }
    // Start where the fort actually is. The old midpoint default opened a 73-level
    // mature recording on an empty black layer even though hundreds of citizens and
    // buildings were present elsewhere.
    const zScore = new Map();
    for (const u of FRAMES[0].units) zScore.set(u[3], (zScore.get(u[3]) || 0) + (u[7] ? 4 : 1));
    for (const b of FRAMES[0].blds) zScore.set(b[6], (zScore.get(b[6]) || 0) + 1);
    curZ = zScore.size
      ? [...zScore].sort((a,b) => b[1]-a[1] || b[0]-a[0])[0][0]
      : z0 + Math.floor(D / 2);
    $("zsel").value = curZ;
    $("zsel").disabled = false;
    $("scrub").max = FRAMES.length - 1;
    $("scrub").disabled = false;
    $("play").disabled = false;
  }
  drawCharts();
  show(0);

  // Small deliberate API for embedders (the side-by-side comparison view drives two
  // of these from one timeline). Top-level `let` bindings are NOT window properties,
  // so they have to be published explicitly; and the recording arrives asynchronously
  // after the iframe's load event, so the parent needs a signal rather than a guess.
  window.BONSAI = {
    get frames() { return FRAMES; },
    get meta() { return META; },
    get cur() { return cur; },
    show,
  };
  try {
    if (window.parent !== window) {
      window.parent.postMessage(
        { type: "bonsai:loaded", frames: FRAMES.length,
          regime_key: META.regime_key, episode_id: META.episode_id }, "*");
    }
  } catch { /* cross-origin embed: the parent will fall back to polling */ }
}

// ---------------------------------------------------------------- rendering
function show(i) {
  cur = Math.max(0, Math.min(i, Math.max(0, FRAMES.length - 1)));
  $("scrub").value = cur;
  if (FRAMES.length) drawMap();
  drawStats();
  drawFeed();
  const f = FRAMES[cur];
  $("pos").textContent = f
    ? `frame ${cur + 1}/${FRAMES.length} · tick ${f.tick}`
    : `${STATS.length} samples`;
}

function drawMap() {
  const f = FRAMES[cur];
  const [W, H] = f.dims;
  const px = +$("zoom").value;
  const zi = curZ - f.origin[2];
  cv.width = W * px; cv.height = H * px;
  ctx.fillStyle = "#0d0c0b"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.font = `${px}px ui-monospace, Consolas, monospace`;
  ctx.textBaseline = "top"; ctx.textAlign = "center";
  ctx.imageSmoothingEnabled = false;
  const sprites = atlasReady && SPRITES && TILEMAP;

  const OPAQUE = sprites ? new Set(SPRITES.opaque || Object.keys(SPRITES.tokens)) : null;
  const FEATURE_SHAPES = new Set(["SHRUB","SAPLING","BOULDER","PEBBLES",
                                  "TWIG","BRANCH","TRUNK_BRANCH"]);
  const viewportValue = (field,x,y,zj=zi) => {
    const vp=f.viewport;
    if(!vp || zj+f.origin[2]!==vp.origin[2] || !vp[field]) return null;
    const sx=x+f.origin[0]-vp.origin[0], sy=y+f.origin[1]-vp.origin[1];
    const [vw,vh]=vp.dims;
    return sx>=0&&sy>=0&&sx<vw&&sy<vh ? vp[field][sy*vw+sx] : null;
  };
  const viewportToken = (field,x,y,zj=zi) => {
    const id=viewportValue(field,x,y,zj), vp=f.viewport;
    const source=vp&&vp.texrefs&&vp.texrefs[id];
    return source&&SPRITES.source_tokens&&SPRITES.source_tokens[source] || null;
  };
  const rampFamily = (prefix,x,y,zj) => {
    const solidAt=(nx,ny) => {
      if (nx<0||ny<0||nx>=W||ny>=H) return true;
      const m=TILEMAP.tiles[f.grid[zj*W*H+ny*W+nx]];
      return !!m&&(m.k==="wall"||m.k==="tree");
    };
    const exact=viewportValue("ramp",x,y,zj);
    let suffix;
    if(exact!==null) suffix=rampSuffixFromFlag(exact);
    else {
      const card=Object.fromEntries(DIRS.map(([d,dx,dy])=>[d,solidAt(x+dx,y+dy)]));
      const c=DIRS.filter(([d])=>card[d]).map(([d])=>d);
      for (const [d,dx,dy,a,b] of [["NW",-1,-1,"N","W"],["NE",1,-1,"N","E"],
                                   ["SW",-1,1,"S","W"],["SE",1,1,"S","E"]])
        if(!card[a]&&!card[b]&&solidAt(x+dx,y+dy)) c.push(d);
      suffix=canonicalRampSuffix(c);
    }
    return epick(suffix?`${prefix}_WITH_WALL_${suffix}`:null,`${prefix}_OTHER`);
  };
  const tokAt = (x, y) => {
    if (x < 0 || y < 0 || x >= W || y >= H) return null;
    const tt = f.grid[zi * W * H + y * W + x];
    const shape=tileInfo(tt)[0], terrain=TILEMAP.tiles[tt];
    const exact=viewportToken("bg",x,y);
    if(exact && terrain && terrain.k!=="tree" &&
       !["SHRUB","SAPLING","BOULDER","PEBBLES","BRANCH","TWIG","TRUNK_BRANCH"].includes(shape))
      return exact;
    // RAMP_TOP is open space above a ramp, with its own multilevel art. Substituting
    // the material ramp base made the same slope appear on both z-levels.
    if (tileInfo(tt)[0] === "RAMP_TOP" && zi > 0) {
      const below=f.grid[(zi-1)*W*H+y*W+x];
      if (tileInfo(below)[0] === "RAMP") return rampFamily("MULTILEVEL_RAMP",x,y,zi-1);
    }
    return spriteToken(tt, x + f.origin[0], y + f.origin[1], curZ, f, W, H, zi);
  };
  const blit = (tok, x, y, row) => {
    if (tok === WALL_INTERIOR) return;
    const T = SPRITES.tile;
    if (PALETTE && row > 0 && PAL_TOKENS.has(tok)) {
      ctx.drawImage(swapped(tok, row), 0, 0, T, T, x * px, y * px, px, px);
      return;
    }
    const [ax, ay] = SPRITES.tokens[tok];
    ctx.drawImage(ATLAS, ax * T, ay * T, T, T, x * px, y * px, px, px);
  };
  const wallBackdrop = (x,y,row) => {
    const c=PALETTE&&row>0&&PALETTE.table[row]?PALETTE.table[row][9]:[47,48,56];
    ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.fillRect(x*px,y*px,px,px);
  };
  // Which palette row a cell's material calls for; 0 leaves the art alone.
  const paletteRow = (x, y, zz) => {
    if (f.palette) return f.palette[(zz-f.origin[2])*W*H+y*W+x];
    if (!GEO_GRID) return 0;
    const tt = f.grid[(zz - f.origin[2]) * W * H + y * W + x];
    // Wood is not geology: a trunk is coloured by its species and the dump knows the rock
    // under the tree. One brown for every tree beats mudstone-coloured branches.
    if (WOODY.has(tileInfo(tt)[1])) return WOOD_ROW;
    const [gw, gh, gd] = GEOLOGY.dims, [gox, goy, goz] = GEOLOGY.origin;
    const ix = x + f.origin[0] - gox, iy = y + f.origin[1] - goy, iz = zz - goz;
    if (ix < 0 || iy < 0 || iz < 0 || ix >= gw || iy >= gh || iz >= gd) return 0;
    return GEO_GRID[iz * gw * gh + iy * gw + ix];
  };
  // Transparent pieces of neighbouring grass. The foreign floor is drawn exactly once;
  // we never paint its stone/soil family or palette over itself as an "edge" layer.
  const edgeTokens = (x, y) => {
    const m = TILEMAP.tiles[f.grid[zi * W * H + y * W + x]];
    if (!m || m.k !== "floor9") return [];
    const grass = (dx, dy) => {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) return false;
      const m2 = TILEMAP.tiles[f.grid[zi * W * H + ny * W + nx]];
      return !!m2 && m2.f === "PLANT_GRASS";
    };
    return [[0,-1,"GRASS_8"],[0,1,"GRASS_2"],[-1,0,"GRASS_6"],[1,0,"GRASS_4"],
            [-1,-1,"GRASS_9"],[1,-1,"GRASS_7"],[-1,1,"GRASS_3"],[1,1,"GRASS_1"]]
      .filter(([dx,dy,t]) => grass(dx,dy) && SPRITES.tokens[t])
      .map(([, , t]) => [t,0]);
  };

  const baseUnder = (x,y) => {
    // The captured bg is DF's actual terrain below a tree/plant, not a guessed
    // material overlay. It is therefore the strongest source when present.
    const exact=viewportToken("bg",x,y);
    if(exact&&OPAQUE.has(exact)) return [exact,0];
    const floorAt=(nx,ny) => {
      if(nx<0||ny<0||nx>=W||ny>=H) return null;
      const tt=f.grid[zi*W*H+ny*W+nx], m=TILEMAP.tiles[tt]||{};
      const family=m.f||"";
      const ground=m.k==="floor9"||m.k==="var4"||
        (m.k==="plain"&&(family.startsWith("FLOOR_")||
                          family==="SMOOTH_ICE_FLOOR"||family==="BROOK_BED"));
      if(!ground) return null;
      const t=tokAt(nx,ny);
      return t&&OPAQUE.has(t)?[t,paletteRow(nx,ny,curZ)]:null;
    };
    for(let radius=1;radius<=4;radius++) {
      const votes=new Map();
      for(let dy=-radius;dy<=radius;dy++) for(let dx=-radius;dx<=radius;dx++) {
        if(Math.max(Math.abs(dx),Math.abs(dy))!==radius) continue;
        const candidate=floorAt(x+dx,y+dy);
        if(!candidate) continue;
        const key=`${candidate[0]}\0${candidate[1]}`;
        const old=votes.get(key)||[candidate,0]; old[1]++; votes.set(key,old);
      }
      if(votes.size) return [...votes.values()].sort((a,b)=>b[1]-a[1])[0][0];
    }
    return null;
  };

  // Show the nearest level below a cell, dimmed with distance. Returns true if anything
  // was found. Eight levels, not three: on the surface level 577 cells of open air over a
  // valley and 162 tree parts had nothing within three and rendered as black boxes. The
  // dim is capped too — 0.45*zoff reached pure black at three levels and painted the
  // deepest visible layer out of existence.
  const showBelow = (x, y) => {
    for (let zoff = 1; zoff <= 8; zoff++) {
      const zj = zi - zoff;
      if (zj < 0) return false;
      const bt = f.grid[zj * W * H + y * W + x];
      const bs = tileInfo(bt)[0];
      if (bs === "EMPTY" || bs === "NONE" || bs === "ENDLESS_PIT" || bs === "RAMP_TOP") continue;
      const btok = spriteToken(bt, x + f.origin[0], y + f.origin[1], curZ - zoff,
                               f, W, H, zj);
      if (!btok) continue;
      blit(btok, x, y, paletteRow(x, y, curZ - zoff));
      ctx.fillStyle = `rgba(0,0,0,${Math.min(0.78, 0.22 * zoff)})`;
      ctx.fillRect(x * px, y * px, px, px);
      return true;
    }
    return false;
  };

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      // Premium DF ships five dedicated unrevealed-rock tiles. Pure black made the
      // edge of explored space indistinguishable from a wall.
      if (f.fog && f.fog[zi * W * H + y * W + x]) {
        ctx.fillStyle="rgb(49,44,52)"; ctx.fillRect(x*px,y*px,px,px);
        const hv=vhash(x+f.origin[0],y+f.origin[1],curZ);
        const hidden=sprites&&(hv&31)===0&&epick(`HIDDEN_ROCK_${((hv>>>5)%5)+1}`,"HIDDEN_ROCK_1");
        if(hidden) blit(hidden,x,y,0);
        continue;
      }
      const tt = f.grid[zi * W * H + y * W + x];
      const [shape, mat] = tileInfo(tt);
      if (sprites) {
        const tok = tokAt(x, y);
        if (!tok) {
          const base=shape==="RAMP_TOP"&&baseUnder(x,y);
          if(base) blit(base[0],x,y,base[1]);
          else showBelow(x,y);
          continue;
        } else {
          // DF composites a tile: an opaque floor, then features on top. Shrubs are
          // 634/1024 opaque, saplings 319, boulders 743 — drawn alone they sit on the
          // page background instead of on the ground. The recording carries no per-tile
          // floor material, so take the ground the neighbours agree on.
          const row = paletteRow(x, y, curZ);
          const terrain=TILEMAP.tiles[tt];
          let rampTopBase = false;
          if (shape === "RAMP_TOP" && zi > 0) {
            const belowTt = f.grid[(zi - 1) * W * H + y * W + x];
            if (tileInfo(belowTt)[0] === "RAMP") {
              // MULTILEVEL_RAMP is a translucent transition pass, not standalone
              // terrain. Paint the real material ramp from z-1 before this upper pass.
              const belowBase = spriteToken(belowTt, x+f.origin[0], y+f.origin[1],
                                            curZ-1, f, W, H, zi-1);
              if (belowBase) {
                blit(belowBase, x, y, paletteRow(x, y, curZ - 1));
                rampTopBase = true;
              }
            }
          }
          if(terrain&&terrain.k==="wall") wallBackdrop(x,y,row);
          if(terrain&&terrain.k==="wall"&&tok===WALL_INTERIOR) continue;
          if (!rampTopBase && (FEATURE_SHAPES.has(shape)||terrain&&terrain.k==="tree")) {
            const base=baseUnder(x,y);
            // A tree branch four levels up has only other branches beside it, so there is
            // no neighbour to borrow ground from — fall through to the level below, which
            // is what DF shows through a canopy. Without this a third of the canopy
            // levels rendered at 22-34% coverage, branches floating on black.
            if (base) blit(base[0], x, y, base[1]);
            else showBelow(x, y);
          }
          const m = TILEMAP.tiles[tt];
          // The old tint multiplied grey art by one colour per material CLASS. Palette
          // art gets the game's own per-material ramp instead, which preserves shading;
          // the multiply survives only for the few tinted tokens that are not palette art.
          if (m && m.t && !(PALETTE && PAL_TOKENS.has(tok))) {
            const T = SPRITES.tile;
            ctx.drawImage(tintedSprite(tok, COLOR[mat] || "#8d8880"),
                          0, 0, T, T, x * px, y * px, px, px);
          } else {
            blit(tok, x, y, row);
          }
          if (shape === "RAMP") {
            const overlay=rampFamily("OVERLAY_RAMP",x,y,zi);
            if (overlay) blit(overlay,x,y,0);
            for (const [d,dx,dy] of DIRS) {
              const nx=x+dx,ny=y+dy;
              if(nx<0||ny<0||nx>=W||ny>=H) continue;
              const near=TILEMAP.tiles[f.grid[zi*W*H+ny*W+nx]];
              if(near&&(near.k==="wall"||near.k==="tree")) {
                const shadow=epick("RAMP_SHADOW_ON_RAMP_"+d);
                if(shadow) blit(shadow,x,y,0);
              }
            }
          }
          for (const [edge,edgeRow] of edgeTokens(x, y)) blit(edge, x, y, edgeRow);
          continue;
        }
      }
      if (sprites) {
        // Open space: DF shows the levels below, dimmed with distance. Without this an
        // open tile is a black void and the fort reads as full of holes.
        if (showBelow(x, y)) continue;
      }
      const g = GLYPH[shape] ?? "?";
      if (g === " ") continue;
      ctx.fillStyle = COLOR[mat] || "#6b665e";
      if (shape === "WALL") ctx.fillRect(x * px, y * px, px, px);
      else ctx.fillText(g, x * px + px / 2, y * px);
    }
  }

  // Wall base art and wall shadows are separate raw layers in Premium DF.
  if (sprites) for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    const p=zi*W*H+y*W+x;
    if (f.fog&&f.fog[p]) continue;
    const here=TILEMAP.tiles[f.grid[p]];
    if (here&&(here.k==="wall"||here.k==="tree")) continue;
    for (const [d,dx,dy] of DIRS) {
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      const near=TILEMAP.tiles[f.grid[zi*W*H+ny*W+nx]];
      if(near&&near.k==="wall") { const s=epick("WALL_SHADOW_STRAIGHT_"+d); if(s) blit(s,x,y,0); }
    }
  }

  // Water and magma are designation state, not terrain or items. Draw the game's own
  // liquid art after terrain and before entities, preserving captured depth.
  if (sprites && f.liquid) {
    for (let y=0; y<H; y++) for (let x=0; x<W; x++) {
      const p=zi*W*H+y*W+x;
      if (f.fog && f.fog[p]) continue;
      const tok=liquidToken(f.liquid[p]);
      if (tok) blit(tok,x,y,0);
    }
  }

  // Only draw buildings for which a real graphical token is known. A generic footprint
  // outline is not DF art and boxed every unsupported/Construction cell.
  const buildingFootprints = new Set();
  for (const b of f.blds) {
    if (b.length < 7 || b[6] !== curZ) continue;
    const cells = sprites ? buildingCells(b) : [];
    if (cells.length) {
      for (const [gx,gy,tok] of cells) {
        buildingFootprints.add(`${gx},${gy},${b[6]}`);
        const x=gx-f.origin[0], y=gy-f.origin[1];
        const p=zi*W*H+y*W+x;
        if (x>=0 && y>=0 && x<W && y<H && !(f.fog&&f.fog[p])) blit(tok,x,y,0);
      }
    }
  }

  // On-ground items use their real item family and material. Inventory and building
  // components are removed at capture time, so they are neither duplicate dots nor
  // visual clutter inside workshops.
  const visibleItems = new Map();
  for (const it of f.items) if (it.length >= 5) {
    const key=`${it[2]},${it[3]},${it[4]}`;
    if (it.length <= 13) {
      const lx=it[2]-f.origin[0],ly=it[3]-f.origin[1],lz=it[4]-f.origin[2];
      let constructionTile=false;
      if(lx>=0&&ly>=0&&lz>=0&&lx<W&&ly<H&&lz<f.dims[2]) {
        const terrainTT=f.grid[lz*W*H+ly*W+lx];
        constructionTile=tileInfo(terrainTT)[1]==="CONSTRUCTION";
      }
      if(buildingFootprints.has(key)||constructionTile) continue;
    }
    visibleItems.set(key, it);
  }
  for (const it of visibleItems.values()) {
    if (it.length < 5 || it[4] !== curZ) continue;
    const x=it[2]-f.origin[0], y=it[3]-f.origin[1], tok=sprites&&itemToken(it);
    const p=zi*W*H+y*W+x;
    if (tok && x>=0 && y>=0 && x<W && y<H && !(f.fog&&f.fog[p])) blit(tok,x,y,it.length>11?it[11]:0);
    else {
      ctx.fillStyle="#5f5a52";
      ctx.fillRect(x*px+px/2-1,y*px+px/2-1,2,2);
    }
  }

  // units last, on top
  for (const u of f.units) {
    const [, x, y, z, , , dead, cit] = u;
    if (z !== curZ) continue;
    const isCit = cit === undefined ? isT0Cohort(u[0]) : !!cit;
    const ux = x - f.origin[0], uy = y - f.origin[1];
    if (ux < 0 || uy < 0 || ux >= W || uy >= H) continue;
    if (f.fog && f.fog[zi*W*H+uy*W+ux]) continue;
    const ctok = sprites && !dead && creatureToken(u);
    if (ctok) {
      blit(ctok, ux, uy, 0);
      continue;
    }
    // wildlife: the recording carries no creature race yet, so mark it rather than
    // guess a species
    ctx.fillStyle = dead ? "#b4574a" : isCit ? "#e8dcc0" : "#b45a46";
    ctx.fillRect(ux * px + px * 0.35, uy * px + px * 0.35, px * 0.3, px * 0.3);
  }
}

// Recordings made before the capture carried an explicit citizen flag fall back to
// the pinned T0 cohort id-set, which is also exactly the set the score counts.
let _cohort = null;
function isT0Cohort(id) {
  if (_cohort === null) {
    const cids = (META.t0_raw && META.t0_raw.cids) || "";
    _cohort = new Set(cids.split(",").filter(Boolean).map(Number));
  }
  return _cohort.has(id);
}

// ---------------------------------------------------------------- side panel
function drawStats() {
  const f = FRAMES[cur];
  const s = f ? nearestStat(f.tick) : STATS[STATS.length - 1];
  if (!s) return;
  const rows = [
    ["dwarves", `${s.alive}/${s.cohort}`, s.alive < s.cohort ? "no" : "ok"],
    ["food", s.food], ["drink", s.drink],
    ["hunger", s.hunger], ["thirst", s.thirst],
    ["stress danger", s.stress_danger, s.stress_danger > 0 ? "no" : ""],
    ["buildings", s.buildings], ["dug", s.dug], ["workorders", s.workorders],
  ];
  $("stats").innerHTML = rows.map(([k, v, cls]) =>
    `<div class="stat"><span>${k}</span><b class="${cls || ""}">${v}</b></div>`).join("");
}

function nearestStat(tick) {
  let best = null, bd = Infinity;
  for (const s of STATS) {
    const d = Math.abs(s.tick - tick);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}

function drawCharts() {
  const series = [
    ["food", "#6d9b5a"], ["drink", "#4a7fb8"], ["hunger", "#c9a227"],
    ["buildings", "#b9b2a6"], ["dug", "#9a7fa8"], ["workorders", "#c98a4a"],
  ];
  const pts = STATS.filter((s) => s.phase !== "t0" || true);
  $("charts").innerHTML = series.map(([k]) => `<div class="stat"><span>${k}</span>` +
    `<b id="v_${k}">${pts.length ? pts[pts.length - 1][k] : "—"}</b></div>` +
    `<canvas class="spark" id="c_${k}" width="356" height="26"></canvas>`).join("");
  for (const [k, col] of series) spark($("c_" + k), pts.map((s) => s[k] ?? 0), col);
}

function spark(c, vals, col) {
  if (!c || !vals.length) return;
  const g = c.getContext("2d");
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  g.clearRect(0, 0, c.width, c.height);
  g.strokeStyle = col; g.lineWidth = 1.5; g.beginPath();
  vals.forEach((v, i) => {
    const x = (i / Math.max(1, vals.length - 1)) * (c.width - 2) + 1;
    const y = c.height - 2 - ((v - lo) / span) * (c.height - 4);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

function drawFeed() {
  const f = FRAMES[cur];
  const activeRound = f ? f.i : -2;
  $("feed").innerHTML = ROUNDS.map((r) => {
    const kept = (r.dispatched || []).map((v) => `<span class="ok">${v}</span>`).join(", ");
    const dropped = (r.dropped || [])
      .map((d) => `<span class="no">✗ ${d.verb || d.reason}</span>`).join(", ");
    const err = r.controller_error
      ? `<div class="no">crashed: ${esc(r.controller_error)}</div>` : "";
    const body = [kept, dropped].filter(Boolean).join("  ") || "<span class='meta'>—</span>";
    return `<div class="round ${r.i === activeRound ? "active" : ""}">
      <div class="hd">round ${r.i} · tick ${r.tick} · ${r.decide_ms}ms</div>
      <div>${body}</div>${err}</div>`;
  }).join("") || "<div class='meta'>no decisions recorded</div>";
  const a = document.querySelector(".round.active");
  if (a) a.scrollIntoView({ block: "nearest" });
}

const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

$("legend").innerHTML = [
  ["@", "#e8dcc0", "your dwarf"], ["·", "#6f8f7a", "wildlife"], ["%", "#b4574a", "dead"],
  ["█", "#8d8880", "stone"], ["█", "#7a5c3e", "soil"], ["█", "#c9a227", "ore vein"],
  ["█", "#b9b2a6", "built wall"], [".", "#5c9a4a", "grass"], ["≈", "#3f6fa8", "water"],
  ["▲", "#8d8880", "ramp"], ["X", "#8d8880", "stairs"], ["▤", "#b9b2a6", "fortification"],
].map(([g, c, t]) => `<i style="color:${c}">${g}</i> ${t}`).join("<br>");

// ---------------------------------------------------------------- interaction
$("scrub").oninput = (e) => show(+e.target.value);
$("zsel").onchange = (e) => { curZ = +e.target.value; drawMap(); };
$("zoom").onchange = () => FRAMES.length && drawMap();
$("play").onclick = () => {
  if (playing) { clearInterval(playing); playing = null; $("play").textContent = "▶"; return; }
  $("play").textContent = "❚❚";
  playing = setInterval(() => {
    if (cur >= FRAMES.length - 1) { clearInterval(playing); playing = null; $("play").textContent = "▶"; return; }
    show(cur + 1);
  }, 400);
};
document.onkeydown = (e) => {
  if (e.key === "ArrowRight") show(cur + 1);
  else if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === " ") { e.preventDefault(); $("play").click(); }
};

cv.onmousemove = (e) => {
  const f = FRAMES[cur];
  if (!f) return;
  const px = +$("zoom").value, r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / px), y = Math.floor((e.clientY - r.top) / px);
  const [W, H] = f.dims;
  if (x < 0 || y < 0 || x >= W || y >= H) { $("tip").style.display = "none"; return; }
  const tt = f.grid[(curZ - f.origin[2]) * W * H + y * W + x];
  const parts = [`(${x + f.origin[0]}, ${y + f.origin[1]}, ${curZ}) ${tileInfo(tt)[2]}`];
  for (const u of f.units) {
    if (u[1] - f.origin[0] === x && u[2] - f.origin[1] === y && u[3] === curZ) {
      parts.push(`${ENUMS.prof[u[4]] || "unit"} — ${ENUMS.job[u[5]] || "idle"}`);
    }
  }
  for (const b of f.blds) {
    if (b[6] === curZ && x + f.origin[0] >= b[2] && x + f.origin[0] <= b[4] &&
        y + f.origin[1] >= b[3] && y + f.origin[1] <= b[5]) {
      parts.push(ENUMS.bld[b[1]] || "building");
    }
  }
  const t = $("tip");
  t.textContent = parts.join(" · ");
  t.style.display = "block";
  t.style.left = e.clientX + 12 + "px";
  t.style.top = e.clientY + 12 + "px";
};
cv.onmouseleave = () => ($("tip").style.display = "none");

$("file").onchange = (e) => e.target.files[0] && loadFile(e.target.files[0]);
document.ondragover = (e) => e.preventDefault();
document.ondrop = (e) => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
};

// ?rec=<url> auto-loads a recording. Needed for the side-by-side comparison view (two
// viewers pointed at two runs) and for linking straight to an episode from a report.
// Requires http(s) — file:// blocks fetch, so drag-and-drop stays the offline path.
(async () => {
  const url = new URLSearchParams(location.search).get("rec");
  if (!url) return;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    const blob = await r.blob();
    await loadFile(new File([blob], url.split("/").pop() || "rec.gz"));
  } catch (err) {
    $("drop").innerHTML =
      `<div><strong>Could not load ${esc(url)}</strong>${esc(err.message)}<br><br>` +
      `Serve the file over http, or drop it here instead.</div>`;
  }
})();
</script>
