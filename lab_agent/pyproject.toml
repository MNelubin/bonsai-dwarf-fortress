[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai-lab-agent"
version = "0.19.4"
description = "Durable OpenCode harness wrapper for the Bonsai Dwarf Fortress lab"
requires-python = ">=3.13"
dependencies = [
  "mypy>=1.20,<2",
  "ruff>=0.15,<1",
]

[project.scripts]
bonsai-lab-agent = "bonsai_lab_agent.worker:main"
bonsai-df-probe = "bonsai_lab_agent.probe_guard:main"
bonsai-k2-proxy = "bonsai_lab_agent.k2_proxy:main"
bonsai-evaluator = "bonsai_lab_agent.evaluator:main"

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["bonsai_lab_agent*"]

[tool.setuptools.package-data]
# design/archive.json was missing from the wheel, so ROOM_TEMPLATE_NAMES came back
# empty in every deployed install and building the action catalog raised
# SchemaError("template: enum needs choices") at import. That made the whole
# gameplay action system unimportable in production while every test passed from
# the source tree, where the file is present.
bonsai_lab_agent = ["dfhack/*.lua", "design/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
